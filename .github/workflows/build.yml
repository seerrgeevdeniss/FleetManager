name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-sqlite3

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -B build-win -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build-win

      - name: Copy DLLs
        shell: msys2 {0}
        run: |
          cp /ucrt64/bin/libgcc_s_seh-1.dll build-win/bin/
          cp /ucrt64/bin/libstdc++-6.dll build-win/bin/
          cp /ucrt64/bin/libwinpthread-1.dll build-win/bin/
          cp /ucrt64/bin/libsqlite3-0.dll build-win/bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleetManager-Windows
          path: build-win/bin/