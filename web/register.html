<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>FleetManager — Регистрация</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-page">
    <div class="login-container">
      <h1>FleetManager</h1>
      <form id="register-form">
        <div class="form-group">
          <input type="text" name="login" placeholder="Логин" required />
        </div>
        <div class="form-group">
          <input
            type="password"
            name="password"
            placeholder="Пароль"
            required
          />
        </div>
        <div class="form-group">
          <input
            type="password"
            name="password2"
            placeholder="Повтор пароля"
            required
          />
        </div>
        <button type="submit" class="btn btn-login">Зарегистрироваться</button>
      </form>
      <div class="link-row">
        Уже есть аккаунт? <a href="index.html">Войти</a>
      </div>
      <div id="register-message" class="error-message hidden"></div>
    </div>

    <script>
      document
        .getElementById("register-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const msg = document.getElementById("register-message");
          msg.classList.add("hidden");
          const fd = new FormData(e.target);

          if (fd.get("password") !== fd.get("password2")) {
            msg.textContent = "Пароли не совпадают";
            msg.classList.remove("hidden");
            return;
          }

          const params = new URLSearchParams();
          params.append("login", fd.get("login"));
          params.append("password", fd.get("password"));

          try {
            const r = await fetch("/api/register", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: params.toString(),
            });
            const data = await r.json();
            if (data.success) {
              window.location.href = "index.html";
            } else {
              msg.textContent = data.message || "Ошибка регистрации";
              msg.classList.remove("hidden");
            }
          } catch (err) {
            msg.textContent = "Сервер недоступен";
            msg.classList.remove("hidden");
          }
        });
    </script>
  </body>
</html>
